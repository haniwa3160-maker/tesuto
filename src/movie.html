<meta charset="utf-8">
<title>ここほれ、シロ！</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden;
           font-family:"Rounded Mplus 1c","M PLUS Rounded 1c",sans-serif; }
  #art { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #scrim { position:absolute; left:0; right:0; bottom:0; height:380px; pointer-events:none;
           background:linear-gradient(to bottom, rgba(28,24,54,0) 0%, rgba(28,24,54,.42) 55%, rgba(28,24,54,.62) 100%); }
  #sub { position:absolute; left:0; right:0; bottom:124px; text-align:center;
         font-weight:800; font-size:48px; line-height:1.30; color:#fff;
         white-space:pre-line; padding:0 150px;
         text-shadow: 0 0 14px rgba(21,18,40,.95),
                      4px 4px 0 #2b2545, -4px 4px 0 #2b2545,
                      4px -4px 0 #2b2545, -4px -4px 0 #2b2545,
                      0 5px 0 #2b2545, 0 -5px 0 #2b2545,
                      5px 0 0 #2b2545, -5px 0 0 #2b2545; }
  #veil { position:absolute; inset:0; background:#1a1c2e; opacity:0; pointer-events:none; }
</style>
<div id="stage">
  <svg id="art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="scrim"></div>
  <div id="veil"></div>
  <div id="sub"></div>
</div>
<script>
// ===================================================================== 基本
const W = 1920, H = 1080;
const HZ   = 560;   // 地平線
const BASE = 860;   // 立ち位置（足元）
const CS   = 1.5;   // キャラの基準スケール
const INK  = '#33305a';
const C = {
  skin:'#ffd9b8', hair:'#4a3226', hoodie:'#ffcf5c', jeans:'#5b7fb5',
  kentaCap:'#2ec4a0', kentaTop:'#4b7fa8', kentaPant:'#3c5a72',
  baaHair:'#ded9e6', baaCloth:'#b79ddb',
  robot:'#fdfdff', robotShade:'#dde3ef', collar:'#ffcf5c', eye:'#41d3f0',
  concrete:'#b9bcc6', concrete2:'#a7abb6', wall:'#cfd3dc', wall2:'#bcc1cc',
  green:'#6fc46a', green2:'#4f9e4c', soil:'#8b6248', soil2:'#6f4c37',
  pink:'#ff8fb1', yellow:'#ffd166', red:'#ff7a6b', purple:'#b18cf0',
};
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*clamp(u);
const smooth=u=>{u=clamp(u);return u*u*(3-2*u);};
const seg=(u,a,b)=>clamp((u-a)/(b-a));
const ease=(u,a,b)=>smooth(seg(u,a,b));
const bob=(t,sp=1,amp=1)=>Math.sin(t*sp*2*Math.PI)*amp;
const R=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
            return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000;};};

const g=(inner,tf='')=>`<g${tf?` transform="${tf}"`:''}>${inner}</g>`;
const rect=(x,y,w,h,f,r=0,st=INK,sw=0)=>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"${sw?` stroke="${st}" stroke-width="${sw}"`:''}/>`;
const circ=(x,y,r,f,st=INK,sw=0)=>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${sw?` stroke="${st}" stroke-width="${sw}"`:''}/>`;
const ell=(x,y,rx,ry,f,st=INK,sw=0)=>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${sw?` stroke="${st}" stroke-width="${sw}"`:''}/>`;
const path=(d,f='none',st=INK,sw=6,cap='round')=>
  `<path d="${d}" fill="${f}" stroke="${st}" stroke-width="${sw}" stroke-linecap="${cap}" stroke-linejoin="round"/>`;
const txt=(x,y,s,size,f='#fff',w=800,anchor='middle')=>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${f}" text-anchor="${anchor}" font-family="Rounded Mplus 1c, sans-serif">${s}</text>`;

// ===================================================================== キャラ（原点＝足元）
function hana(t,{x=0,y=BASE,s=CS,emote='neutral',arm='down',flip=false,walk=0}={}){
  const b = bob(t,0.5,4);
  const blink = (Math.sin(t*1.7)>0.965)?1:0;
  const eye = (dx)=>{
    if(emote==='sad'||emote==='cry') return path(`M ${dx-13} -6 q 13 -10 26 0`,'none',INK,6);
    if(emote==='happy') return path(`M ${dx-13} 2 q 13 -16 26 0`,'none',INK,7);
    if(blink) return path(`M ${dx-12} -2 h 24`,'none',INK,6);
    return circ(dx,-2,8.5,INK);
  };
  const mouth = {
    neutral: path('M -10 34 q 10 6 20 0','none',INK,5),
    sad:     path('M -12 40 q 12 -9 24 0','none',INK,5),
    happy:   path('M -18 28 q 18 24 36 0','#8a4a52',INK,5),
    wow:     ell(0,36,14,17,'#8a4a52',INK,5),
    cry:     path('M -12 40 q 12 -9 24 0','none',INK,5),
  }[emote];
  const tears = (emote==='cry')
      ? ell(-30,20+((t*70)%64),7,11,'#8fd3ef',INK,3)+ell(30,10+((t*70+32)%64),7,11,'#8fd3ef',INK,3) : '';
  const armD = arm==='up'
      ? 'M -46 -8 q -40 -28 -32 -62 M 46 -8 q 40 -28 32 -62'
      : arm==='hold'
      ? 'M -46 -2 q -32 26 -8 36 M 46 -2 q 32 26 8 36'
      : 'M -46 -4 q -20 40 -12 60 M 46 -4 q 20 40 12 60';
  const legSw = Math.sin(walk*2*Math.PI)*16;
  const head = g(
      circ(0,0,54,C.skin,INK,7)+
      path('M -56 -6 q 4 -62 56 -62 q 52 0 56 62 q -16 -26 -30 -22 q -22 -18 -50 -6 q -20 8 -32 28 z',C.hair,INK,6)+
      path('M 50 -18 q 48 6 40 56 q -6 40 -30 40 q 16 -34 -2 -60 q -10 -18 -18 -22 z',C.hair,INK,6)+
      circ(54,-26,11,C.pink,INK,5)+
      eye(-22)+eye(22)+mouth+tears+
      circ(-40,20,11,'#ffb3b3')+circ(40,20,11,'#ffb3b3'),
      `translate(0,${-120+b})`);
  const body =
      path('M -50 -20 q -8 74 -2 108 q 52 12 104 0 q 6 -34 -2 -108 q -26 -14 -50 -14 q -24 0 -50 14 z',C.hoodie,INK,7)+
      path('M -30 -22 q 30 30 60 0','none',INK,6)+
      rect(-52,-32,104,26,C.hoodie,13,INK,7)+
      path(`M -22 88 v ${44+legSw}`,'none',C.jeans,26)+
      path(`M  22 88 v ${44-legSw}`,'none',C.jeans,26)+
      path(`M -22 ${132+legSw} h -8`,'none',INK,20)+
      path(`M  22 ${132-legSw} h  8`,'none',INK,20)+
      path(armD,'none',C.hoodie,24);
  return g(shadow(0,2,62)+g(body+head,'translate(0,-132)'),
           `translate(${x},${y}) scale(${flip?-s:s},${s})`);
}

function shiro(t,{x=0,y=BASE,s=CS,on=true,flip=false,dig=0,lie=false,glow=1}={}){
  const wag = on? Math.sin(t*6)*22 : 0;
  const b   = on? bob(t,1.1,3) : 0;
  const digA= dig? Math.sin(t*14)*22 : 0;
  const eyeCol = on? C.eye : '#a3a9b6';
  const halo = on? `<circle cx="16" cy="-6" r="${26+4*Math.sin(t*5)}" fill="${C.eye}" opacity="${0.26*glow}"/>`:'';
  const legs = lie
      ? rect(-46,22,86,20,C.robotShade,10,INK,6)          // ふせた姿勢：脚をたたむ
      : rect(-48,30,24,34,C.robot,11,INK,6)+rect(22,30,24,34,C.robot,11,INK,6)+
        rect(-30,32,22,32,C.robotShade,11,INK,6)+rect(6,32,22,32,C.robotShade,11,INK,6);
  const body =
      rect(-62,-34,116,70,C.robot,32,INK,7)+
      path('M -60 6 q 58 22 112 0 q 0 24 -12 28 q -44 10 -88 0 q -12 -6 -12 -28 z',C.robotShade)+
      rect(-62,-34,116,70,'none',32,INK,7)+
      circ(-26,-2,8,C.robotShade)+circ(0,-2,8,C.robotShade)+circ(26,-2,8,C.robotShade)+
      legs+
      g(path(`M 52 -20 q 36 ${lie?18:-6} 44 ${lie?4:-36}`,'none',INK,7)+
        circ(96,lie?-16:-58,10,C.collar,INK,5), `rotate(${wag},52,-20)`);
  const head = g(
      // 耳：右は無事な丸い垂れ耳／左は欠けた小さな stub
      path('M 22 -48 q 12 -50 52 -34 q -4 30 -18 40 z',C.robot,INK,6)+
      path('M -34 -46 q 2 -24 20 -22 l -2 24 z',C.robot,INK,6)+
      rect(-44,-52,92,80,C.robot,28,INK,7)+
      // マズル
      rect(-30,4,58,32,C.robotShade,16,INK,6)+ ell(0,10,11,8,INK)+
      path('M 0 18 v 8','none',INK,5)+
      halo+
      circ(-12,-14,16,eyeCol,INK,6)+(on?circ(-7,-19,5.5,'#fff'):'')+
      circ(26,-14,16,eyeCol,INK,6)+(on?circ(31,-19,5.5,'#fff'):''),
      `translate(56,${-52+b}) rotate(${lie?14:0})`);
  const collar = rect(-6,-22,32,58,C.collar,11,INK,6);
  const inner  = g(collar+body+head, `translate(0,${b}) rotate(${digA*0.5},0,20)`);
  return g(shadow(6,2,lie?86:70)+g(inner,`translate(0,${lie?-42:-64})`),
           `translate(${x},${y}) scale(${flip?-s:s},${s})`);
}

function kenta(t,{x=0,y=BASE,s=CS,emote='neutral',phone=false,flip=false}={}){
  const b = bob(t,0.45,4);
  const eye = (dx)=>{
    if(emote==='angry') return path(`M ${dx-14} -14 l 28 9`,'none',INK,6)+circ(dx,0,7.5,INK);
    if(emote==='sorry') return path(`M ${dx-12} -2 q 12 9 24 0`,'none',INK,6);
    if(emote==='happy') return path(`M ${dx-12} 2 q 12 -14 24 0`,'none',INK,6);
    return circ(dx,-2,7.5,INK);
  };
  const mouth = {
    neutral: path('M -10 32 q 10 5 20 0','none',INK,5),
    angry:   path('M -16 38 q 16 -15 32 0','none',INK,6),
    sorry:   path('M -12 38 q 12 -7 24 0','none',INK,5),
    happy:   path('M -16 26 q 16 20 32 0','#8a4a52',INK,5),
  }[emote];
  const head = g(
      circ(0,0,50,C.skin,INK,7)+
      path('M -52 -14 q 6 -52 52 -52 q 46 0 52 52 q -30 -20 -52 -20 q -22 0 -52 20 z',C.hair,INK,6)+
      path('M -54 -20 q 4 -56 54 -56 q 50 0 54 56 z',C.kentaCap,INK,7)+
      path('M -80 -18 q 42 -16 80 -2 q -32 14 -80 2 z',C.kentaCap,INK,7)+
      eye(-20)+eye(20)+mouth,
      `translate(0,${-116+b})`);
  const arms = phone
      ? path('M -44 -4 q -8 -44 22 -50 M 44 -4 q 8 -44 -22 -50','none',C.kentaTop,22)
      : path('M -44 -4 q -18 40 -10 58 M 44 -4 q 18 40 10 58','none',C.kentaTop,22);
  const ph = phone
      ? g(rect(-17,-28,34,56,'#2c2c3a',7,INK,5)+rect(-12,-22,24,44,'#89e0ff',4),'translate(0,-74)')
      : '';
  const body =
      path('M -46 -18 q -8 72 -2 104 q 48 12 96 0 q 6 -32 -2 -104 q -24 -14 -46 -14 q -22 0 -46 14 z',C.kentaTop,INK,7)+
      rect(-14,-30,28,20,C.skin,6)+
      path('M -20 84 v 46','none',C.kentaPant,26)+
      path('M  20 84 v 46','none',C.kentaPant,26)+
      path('M -20 130 h -8','none',INK,20)+path('M 20 130 h 8','none',INK,20)+
      arms+ph;
  return g(shadow(0,2,60)+g(body+head,'translate(0,-130)'),
           `translate(${x},${y}) scale(${flip?-s:s},${s})`);
}

function baa(t,{x=0,y=BASE,s=CS*0.92,flip=false,emote='happy'}={}){
  const b = bob(t,0.4,3);
  const head = g(
      circ(0,0,48,C.skin,INK,7)+
      path('M -50 -8 q 6 -50 50 -50 q 44 0 50 50 q -32 -24 -50 -24 q -18 0 -50 24 z',C.baaHair,INK,6)+
      circ(0,-58,21,C.baaHair,INK,6)+
      circ(-22,-2,20,'none',INK,5)+circ(22,-2,20,'none',INK,5)+path('M -2 -2 h 4','none',INK,5)+
      path('M -42 -6 l -8 -4 M 42 -6 l 8 -4','none',INK,5)+
      circ(-22,0,6,INK)+circ(22,0,6,INK)+
      (emote==='happy'?path('M -14 28 q 14 16 28 0','#8a4a52',INK,5)
                      :path('M -10 30 q 10 5 20 0','none',INK,5))+
      circ(-36,16,10,'#ffb3b3')+circ(36,16,10,'#ffb3b3'),
      `translate(0,${-110+b})`);
  const body =
      path('M -44 -14 q -10 66 -4 96 q 46 12 92 0 q 6 -30 -4 -96 q -22 -12 -42 -12 q -20 0 -42 12 z',C.baaCloth,INK,7)+
      path('M -42 -6 q -20 44 -12 62 M 42 -6 q 20 44 12 62','none',C.baaCloth,22)+
      path('M -18 80 v 42','none','#7a6f8a',24)+path('M 18 80 v 42','none','#7a6f8a',24)+
      path('M -18 122 h -8','none',INK,18)+path('M 18 122 h 8','none',INK,18);
  return g(shadow(0,2,56)+g(body+head,'translate(0,-122)'),
           `translate(${x},${y}) scale(${flip?-s:s},${s})`);
}

function crowd(t,seed,n,x0,x1,y,s){
  const r=R('crowd'+seed); let o='';
  const cols=[C.pink,C.yellow,C.purple,'#7fd1c9','#ff9f68','#8fd3ef'];
  for(let i=0;i<n;i++){
    const x=lerp(x0,x1,r()), sc=s*(0.85+r()*0.3), c=cols[Math.floor(r()*cols.length)];
    const bb=Math.sin(t*(1.6+r()*1.4)+i)*5;
    o+=g(shadow(0,52,42,0.13)+circ(0,-76,26,C.skin,INK,5)+
         path('M -32 -52 q -6 54 -2 76 q 34 8 68 0 q 4 -22 -2 -76 z',c,INK,5)+
         path('M -13 24 v 26 M 13 24 v 26','none','#4c5570',14),
         `translate(${x},${y+bb}) scale(${sc})`);
  }
  return o;
}

// ===================================================================== 背景
function sky(a,b){
  return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`+
    rect(0,0,W,H,'url(#sk)');
}
function cloud(x,y,s,c='#fff'){
  return g(ell(0,0,92,52,c)+ell(-72,16,58,38,c)+ell(74,18,52,34,c),`translate(${x},${y}) scale(${s})`);
}
// 団地（背景なので小さめ・軽め）
function danchi(seed,{lit=0.3,warm=false,open=0,green=false}={}){
  const specs=[[70,300,300,260],[400,240,340,320],[790,270,300,290],[1130,225,350,335],[1520,290,330,270]];
  let o='';
  specs.forEach((sp,k)=>{
    const [x,y,w,h]=sp; const r=R(seed+k);
    o+=rect(x,y,w,HZ-y+10,C.wall,10,INK,6)+rect(x,y,w,14,C.wall2,5,INK,4);
    const cols=Math.max(2,Math.round(w/78)), rows=Math.max(2,Math.round((HZ-y)/72));
    const ww=w/cols*0.52, wh=(HZ-y)/rows*0.46;
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      const wx=x+w/cols*(i+0.5)-ww/2, wy=y+(HZ-y)/rows*(j+0.45)-wh/2;
      const on=r()<lit;
      o+=rect(wx,wy,ww,wh,on?(warm?'#ffd98a':'#cfe6f5'):'#98a0b0',5,INK,3.5);
      if(r()<open) o+=rect(wx,wy,ww/2,wh,'#5d6478',3,INK,2.5);
    }
  });
  return o + hedge(seed,{green});
}
// 建物の足元の植え込み。中景が空くのを埋める
function hedge(seed,{green=false}={}){
  const r=R('hedge'+seed); let o='';
  const spans=[[40,340],[420,760],[820,1120],[1180,1520],[1580,1880]];
  for(const [x0,x1] of spans){
    const y=HZ+4, h=42;
    o+=rect(x0,y-h,x1-x0,h+10, green?'#6ea55f':'#8f9aa0', 16, INK, 5);
    for(let x=x0+26;x<x1-16;x+=44)
      o+=ell(x,y-h+6+r()*8, 24, 18, green?'#7db06c':'#9aa5aa');
  }
  return o;
}
function ground(col=C.concrete,edge='#9aa0ab',joints=true){
  let joint='';
  if(joints){
    // 舗装の目地。奥ほど詰まって見えるように、手前ほど間隔を広げる
    let y=HZ+44, step=24;
    while(y<H+80){ joint+=path(`M 0 ${y} H ${W}`,'none',edge,3.2); y+=step; step*=1.32; }
    for(let i=-6;i<=6;i++){
      joint+=path(`M ${W/2+i*88} ${HZ+38} L ${W/2+i*440} ${H+90}`,'none',edge,3.2);
    }
    joint=`<g opacity="0.55">${joint}</g>`;
  }
  return rect(0,HZ,W,H-HZ,col)+joint+
         path(`M 0 ${HZ} H ${W}`,'none',edge,6)+rect(0,HZ+6,W,10,'#c8ccd4');
}
// 足元の影。これが無いとキャラが地面から浮いて見える
function shadow(x,y,rx=64,op=0.15){
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*0.24}" fill="#2b2545" opacity="${op}"/>`;
}

function flower(x,y,s,col,t,ph=0){
  const sw=Math.sin(t*1.6+ph)*5; let p='';
  for(let i=0;i<5;i++){const a=i*72+sw*2;
    p+=ell(Math.cos(a*Math.PI/180)*22,Math.sin(a*Math.PI/180)*22,16,16,col,INK,4);}
  return g(path(`M 0 62 q ${sw} -32 0 -48`,'none',C.green2,7)+
           ell(-14,34,14,8,C.green,INK,4)+ell(14,26,14,8,C.green,INK,4)+
           g(p+circ(0,0,11,C.yellow,INK,4),`translate(${sw},0)`),
           `translate(${x},${y}) scale(${s})`);
}
function sprout(x,y,s,grow,t){
  const h=lerp(0,52,grow), sw=Math.sin(t*2+x)*3;
  return g(ell(0,2,26*grow,9*grow,C.soil)+
           path(`M 0 0 q ${sw} ${-h/2} 0 ${-h}`,'none',C.green2,8)+
           (grow>0.35?ell(-15,-h+7,15*grow,9*grow,C.green,INK,4):'')+
           (grow>0.55?ell(15,-h+19,15*grow,9*grow,C.green,INK,4):''),
           `translate(${x},${y}) scale(${s})`);
}
function crack(x,y,s,seed='c'){
  const r=R(seed); let d=`M ${x} ${y}`,cx=x,cy=y;
  for(let i=0;i<7;i++){cx+=(r()-0.35)*76*s;cy-=(22+r()*28)*s;d+=` L ${cx} ${cy}`;}
  return path(d,'none','#8f939f',5*s);
}
function dust(t,x,y,n,seed,col='#a98868'){
  const r=R(seed); let o='';
  for(let i=0;i<n;i++){const ph=(t*1.6+r())%1;
    o+=circ(x+(r()-0.5)*240*ph*1.6, y-ph*170-r()*30, lerp(20,4,ph), col);}
  return `<g opacity="0.72">${o}</g>`;
}
function petals(t,n,seed){
  const r=R(seed); let o='';
  const cols=[C.pink,'#ffc2d4',C.yellow,'#fff'];
  for(let i=0;i<n;i++){
    const sp=0.5+r()*0.7, ph=(t*sp*0.16+r())%1;
    o+=g(ell(0,0,16,10,cols[Math.floor(r()*4)]),
         `translate(${(r()*W+Math.sin(t*sp+i)*90)%W},${ph*(H+160)-80}) rotate(${(t*90*sp+i*40)%360})`);
  }
  return `<g opacity="0.92">${o}</g>`;
}
function snow(t,n,seed){
  const r=R(seed); let o='';
  for(let i=0;i<n;i++){const sp=0.4+r()*0.6, ph=(t*sp*0.13+r())%1;
    o+=circ((r()*W+Math.sin(t*sp+i)*50)%W, ph*(H+120)-60, 4+r()*6,'#fff');}
  return `<g opacity="0.9">${o}</g>`;
}
function rainOn(t,x,y,w,h){
  const r=R('rain'); let o='';
  for(let i=0;i<26;i++){const ph=(t*0.9+r())%1;
    o+=path(`M ${x+r()*w} ${y+ph*h} l -4 26`,'none','#a9c7dd',4);}
  return o;
}
function cam(inner,{zx=W/2,zy=HZ+120,z=1,dx=0,dy=0}={}){
  return g(inner,`translate(${zx+dx},${zy+dy}) scale(${z}) translate(${-zx},${-zy})`);
}
// 屋内（部屋）の基本セット
function room({wall='#f4efe6',back='#e7e2da',win='#cfe0ee',night=false,rain=false,t=0,desk=true}={}){
  return rect(0,0,W,H,back)+
    rect(60,60,1800,900,wall,26,INK,8)+
    rect(1240,150,540,420,win,18,INK,8)+
    (rain?rainOn(t,1260,160,500,400):'')+
    (night?circ(1620,270,54,'#fff4c2',INK,6)+circ(1330,230,5,'#fff')+circ(1420,420,4,'#fff'):
           rect(1280,300,120,270,'#aab0bb',8)+rect(1430,260,140,310,'#9ea5b1',8)+
           rect(1600,330,130,240,'#aab0bb',8))+
    rect(1240,150,540,420,'none',18,INK,8)+

// ---- S8 シロのひみつ

        g(flower(0,0,2.3,'#fff',t,0)+

          // 花にかこまれた場所に、シロの首輪だけがそっと置いてある

      `translate(960,400) scale(${lerp(0.62,1,pop)})`);

// ===================================================================== 進行
let TL=null;
function setTimeline(tl){ TL=tl; }
function eventAt(tt){
  if(!TL) return null;
  let cur=null;
  for(const e of TL.events){ if(tt>=e.start-0.001) cur=e; else break; }
  return cur;
}
window.__seek = function(tt){
  const art=document.getElementById('art'), sub=document.getElementById('sub');
  let sceneId=TL.order[0], st=0, en=1;
  for(const k of TL.order){
    const s=TL.scenes[k]; if(!s) continue;
    if(tt>=s.start-0.0001){ sceneId=k; st=s.start; en=s.end; }
  }
  const u=clamp((tt-st)/Math.max(0.001,en-st));
  art.innerHTML = SCENES[sceneId](u,tt);

  const e=eventAt(tt);
  let text = (e && e.sub && tt<=e.end+0.45) ? e.sub : '';
  if(sceneId==='end' && u>0.48) text='';
  if(sceneId==='op' && u>0.66) text='';
  sub.textContent = text;
  const col={N:'#ffffff',hana:'#ffe9a8',kenta:'#c8f5e6',baa:'#efe2ff',all:'#ffd9e6'};
  sub.style.color = (e && col[e.speaker]) ? col[e.speaker] : '#ffffff';
  document.getElementById('scrim').style.opacity = text ? 1 : 0.35;
};
